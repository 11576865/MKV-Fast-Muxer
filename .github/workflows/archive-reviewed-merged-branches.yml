name: Reviewed merged-PR branch cleanup 2026-11-03

on:
  pull_request:
    paths:
      - 'scripts/archive_reviewed_merged_branches.py'
      - 'scripts/test_archive_reviewed_merged_branches.py'
      - 'docs/branch-archive-allowlist-2026-11-03.json'
      - '.github/workflows/archive-reviewed-merged-branches.yml'
  push:
    branches: [maintenance/archive-reviewed-merged-pr-refs]
    paths:
      - 'docs/branch-archive-allowlist-2026-11-03.json'
  workflow_dispatch:

concurrency:
  group: mkv-reviewed-merged-pr-archive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise branch eligibility and archive safety guards
        run: python3 -m unittest scripts.test_archive_reviewed_merged_branches -v

  archive:
    needs: safety-tests
    if: github.repository == '11576865/MKV-Fast-Muxer' && github.ref == 'refs/heads/maintenance/archive-reviewed-merged-pr-refs' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Archive exact reviewed heads, then delete only via SHA lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/archive_reviewed_merged_branches.py --apply | tee branch-cleanup.log
      - name: Preserve exact review inventory and cleanup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softmux-branch-cleanup-20261103
          path: |
            branch-cleanup.log
            docs/branch-archive-allowlist-2026-11-03.json
            docs/branch-inventory-2026-11-03.json
          if-no-files-found: error
          retention-days: 14
