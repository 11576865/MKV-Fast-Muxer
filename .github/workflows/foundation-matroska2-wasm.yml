name: BSD Matroska Foundation WebAssembly real-file feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/foundation-matroska2-wasm.yml'
      - 'scripts/probe-foundation-matroska2-wasm.mjs'
      - 'scripts/patch-foundation-corec-emscripten.mjs'
      - 'scripts/probe-foundation-matroska2-browser.mjs'
      - 'scripts/native/foundation-matroska-json-probe.c'
      - 'scripts/workers/foundation-matroska-worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-wasm-real-file:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Softmux test harness
        uses: actions/checkout@v4

      - name: Pin upstream BSD-licensed Foundation source
        uses: actions/checkout@v4
        with:
          repository: Matroska-Org/foundation-source
          ref: d69761114b79c1dfcb2226ceca84452835e745c3
          path: .e2e/foundation-upstream
          persist-credentials: false

      - name: Set up pinned Emscripten compiler
        uses: mymindstorm/setup-emsdk@v14
        with:
          emsdk-version: '3.1.68'

      - name: Generate independent Matroska input
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg mkvtoolnix python3-fonttools fonts-dejavu-core
          mkdir -p .e2e/output
          E2E_PYTHON=/usr/bin/python3 bash tests/e2e/generate-fixtures.sh
          bash tests/e2e/generate-independent-matroska-fixture.sh
          mkvmerge -J .e2e/fixtures/p0-independent-mkvtoolnix.mkv > .e2e/output/foundation-reference-mkvmerge.json
          # Real attachment-heavy MKV, >96 MiB, with sparse source payload.
          # This file remains in the job workspace, never uploaded as CI artifact.
          truncate -s 100663296 .e2e/fixtures/foundation-large-payload.bin
          mkvmerge -o .e2e/fixtures/foundation-large-attachment.mkv \
            --no-attachments .e2e/fixtures/p0-independent-mkvtoolnix.mkv \
            --attachment-name foundation-large.bin \
            --attachment-mime-type application/octet-stream \
            --attach-file .e2e/fixtures/foundation-large-payload.bin
          mkvmerge -J .e2e/fixtures/foundation-large-attachment.mkv > .e2e/output/foundation-large-reference-mkvmerge.json
          test "$(stat -c %s .e2e/fixtures/foundation-large-attachment.mkv)" -gt 100000000

      - name: Apply tiny upstream Core-C Emscripten platform adapter (test only)
        run: |
          set -euo pipefail
          node scripts/patch-foundation-corec-emscripten.mjs
          git -C .e2e/foundation-upstream diff --check
          git -C .e2e/foundation-upstream diff -- corec/corec/portab.h > .e2e/output/foundation-wasm-corec-portability.diff
          test -s .e2e/output/foundation-wasm-corec-portability.diff

      - name: Add machine-readable C ABI test target to temporary upstream build
        run: |
          set -euo pipefail
          cat >> .e2e/foundation-upstream/libmatroska2/CMakeLists.txt <<'CMAKE'
          add_executable(foundation_json_probe "${FOUNDATION_BRIDGE_SOURCE}")
          target_link_libraries(foundation_json_probe PRIVATE "matroska2" "ebml2" "corec")
          set_target_properties(foundation_json_probe PROPERTIES C_STANDARD 11)
          target_link_options(foundation_json_probe PRIVATE
            "-sEXPORT_NAME=createFoundationJSON"
            "-sEXPORTED_FUNCTIONS=_main,_foundation_probe,_foundation_json"
            "-lworkerfs.js"
            "-sEXPORTED_RUNTIME_METHODS=FS,ccall,WORKERFS")
          CMAKE
          git -C .e2e/foundation-upstream diff --check
          git -C .e2e/foundation-upstream diff -- libmatroska2/CMakeLists.txt > .e2e/output/foundation-wasm-structured-target.diff

      - name: Compile actual BSD libEBML2 and libMatroska2 into Emscripten Wasm
        run: |
          set -euo pipefail
          mkdir -p .e2e/output
          emcc --version | head -n 2
          emcmake cmake -S .e2e/foundation-upstream -B .e2e/foundation-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCONFIG_MATROSKA2=ON \
            -DCONFIG_EBML_WRITING=ON \
            -DCONFIG_ZLIB=OFF -DCONFIG_BZLIB=OFF \
            -DCONFIG_LZO1X=OFF -DCONFIG_CODEC_HELPER=OFF \
            -DCONFIG_DEBUGCHECKS=OFF \
            "-DFOUNDATION_BRIDGE_SOURCE=${GITHUB_WORKSPACE}/scripts/native/foundation-matroska-json-probe.c" \
            '-DCMAKE_EXE_LINKER_FLAGS=-sMODULARIZE=1 -sEXPORT_NAME=createFoundationMkvtree -sEXPORTED_RUNTIME_METHODS=FS,callMain -sINVOKE_RUN=0 -sALLOW_MEMORY_GROWTH=1 -sEMULATE_FUNCTION_POINTER_CASTS=1 -sASSERTIONS=2 -sENVIRONMENT=web,worker,node' \
            2>&1 | tee .e2e/output/foundation-wasm-configure.log
          cmake --build .e2e/foundation-build --target mkvtree foundation_json_probe -j 2 \
            2>&1 | tee .e2e/output/foundation-wasm-build.log
          test -s .e2e/foundation-build/libmatroska2/mkvtree.js
          test -s .e2e/foundation-build/libmatroska2/mkvtree.wasm
          test -s .e2e/foundation-build/libmatroska2/foundation_json_probe.js
          test -s .e2e/foundation-build/libmatroska2/foundation_json_probe.wasm

      - name: Execute upstream Matroska parser Wasm against a genuine MKV
        env:
          FOUNDATION_WASM_JS: .e2e/foundation-build/libmatroska2/mkvtree.js
          FOUNDATION_FIXTURE: .e2e/fixtures/p0-independent-mkvtoolnix.mkv
        run: node scripts/probe-foundation-matroska2-wasm.mjs

      - name: Install browser probe dependencies
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          if command -v google-chrome >/dev/null 2>&1; then
            echo "FOUNDATION_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "FOUNDATION_CHROMIUM_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "FOUNDATION_CHROMIUM_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Execute upstream Matroska parser Wasm in real Chromium
        env:
          FOUNDATION_WASM_JS: .e2e/foundation-build/libmatroska2/mkvtree.js
          FOUNDATION_FIXTURE: .e2e/fixtures/p0-independent-mkvtoolnix.mkv
          FOUNDATION_STRUCTURED_WASM_JS: .e2e/foundation-build/libmatroska2/foundation_json_probe.js
        run: node scripts/probe-foundation-matroska2-browser.mjs

      - name: Upload actual compiler, Wasm and independent file evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-matroska2-wasm-actual-build-and-read
          path: |
            .e2e/output/foundation-wasm-configure.log
            .e2e/output/foundation-wasm-build.log
            .e2e/output/foundation-wasm-corec-portability.diff
            .e2e/output/foundation-wasm-structured-target.diff
            .e2e/output/foundation-reference-mkvmerge.json
            .e2e/output/foundation-large-reference-mkvmerge.json
            .e2e/output/foundation-matroska2-wasm-probe.json
            .e2e/output/foundation-matroska2-chromium-probe.json
            .e2e/foundation-build/libmatroska2/mkvtree.js
            .e2e/foundation-build/libmatroska2/mkvtree.wasm
            .e2e/foundation-build/libmatroska2/foundation_json_probe.js
            .e2e/foundation-build/libmatroska2/foundation_json_probe.wasm
            .e2e/foundation-upstream/LICENSE
          if-no-files-found: warn
          retention-days: 14
