name: Softmux 1.0 evidence-gated release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact immutable product commit SHA, not a moving branch
        required: true
        type: string
      evidence_sha:
        description: Later reviewed evidence revision SHA; must descend from candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Independently check out the later acceptance-evidence revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evidence_sha }}
          path: evidence
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install product candidate tooling
        working-directory: candidate
        run: npm install
      - name: Validate exact candidate, descendant evidence and live job-level acceptance
        working-directory: candidate
        run: npm run release:gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOFTMUX_RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/evidence
          SOFTMUX_RELEASE_EVIDENCE_SHA: ${{ inputs.evidence_sha }}
