name: Softmux V3 design pilot (not release gate)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/softmux-v3-*'
      - 'src/main.js'
      - 'src/ui-mode.js'
      - 'src/v3-blank-mkv.js'
      - 'src/softmux-v3-intent.js'
      - 'tests/v3-blank-mkv.test.mjs'
      - 'tests/e2e/v3-blank-target.e2e.mjs'
      - 'tests/softmux-v3-surface.test.mjs'
      - 'tests/softmux-v3-intent.test.mjs'
      - 'tests/e2e/v3-source-first.e2e.mjs'
      - 'tests/e2e/v3-default-route.e2e.mjs'
      - 'tests/ui-mode.test.mjs'
      - 'tests/e2e/v3-source-ass-preview.e2e.mjs'
      - 'tests/e2e/v3-cross-source-subrip.e2e.mjs'
      - 'tests/e2e/v3-responsive-geometry.e2e.mjs'
      - 'tests/e2e/v35-native-feature-nav.e2e.mjs'
      - 'tests/e2e/v35-source-structure.e2e.mjs'
      - 'tests/e2e/v35-batch-deep-workflow.e2e.mjs'
      - 'tests/e2e/v35-batch-many-job-density.e2e.mjs'
      - 'scripts/ui-v3-build-comparison.mjs'
      - 'docs/ui-v3/**'
      - '.github/workflows/ui-v3-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-first-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser and Chinese-capable font
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1; then packages+=(ffmpeg); fi
          if ! command -v fc-list >/dev/null 2>&1; then
            packages+=(fontconfig fonts-noto-cjk)
          elif [[ -z "$(fc-list :lang=zh-cn family)" ]]; then
            packages+=(fonts-noto-cjk)
          fi
          if (("${#packages[@]}" > 0)); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          command -v ffmpeg
          fc-cache -f
          test -n "$(fc-list :lang=zh-cn family)"
      - name: Start preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/softmux-v3-preview.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/softmux-v3-preview.log
          exit 1
      - name: Real Chromium V3 source-first UI pilot
        run: node tests/e2e/v3-source-first.e2e.mjs
      - name: Real Chromium V3 exact-source SubRip transfer to explicit target
        run: node tests/e2e/v3-cross-source-subrip.e2e.mjs
      - name: Real Chromium V3 native source ASS preview
        run: node tests/e2e/v3-source-ass-preview.e2e.mjs
      - name: Chromium V3 responsive geometry and File continuity audit
        run: node tests/e2e/v3-responsive-geometry.e2e.mjs
      - name: Chromium V3.5 real batch/tools entry and File authority pilot
        run: node tests/e2e/v35-native-feature-nav.e2e.mjs
      - name: Chromium V3.5 real MKV source attachments chapters and tags
        run: node tests/e2e/v35-source-structure.e2e.mjs
      - name: Chromium V3.5 native batch flow and real independently audited MKV
        run: node tests/e2e/v35-batch-deep-workflow.e2e.mjs
      - name: Chromium V3.5 actual 16-job tablet split inspector and compact editor focus
        run: node tests/e2e/v35-batch-many-job-density.e2e.mjs
      - name: Real native five-track compact target visual evidence (not design signoff)
        run: node tests/e2e/v3-multitrack-visual.e2e.mjs
      - name: Real Chromium V3 new blank MKV from explicit source stream, native ffprobe and output SHA
        run: node tests/e2e/v3-blank-target.e2e.mjs
      - name: Build Figma-vs-browser visual review pairs (not pixel acceptance)
        run: node scripts/ui-v3-build-comparison.mjs
      - name: Upload exact-HEAD V3 UI screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v3-pilot-source-first-evidence
          path: |
            .e2e/ui-v3-evidence/
            .e2e/ui-v3-default-route/
            .e2e/ui-v3-cross-source/
            .e2e/ui-v3-ass-source/
            .e2e/ui-v3-responsive/
            .e2e/ui-v35-navigation/
            .e2e/ui-v35-source-structure/
            .e2e/ui-v35-batch-deep-workflow/
            .e2e/ui-v35-batch-density/
            .e2e/ui-v3-multitrack/
            .e2e/ui-v3-blank-target/
            .e2e/ui-v3-visual-comparison/

          retention-days: 14
          if-no-files-found: warn

  # A parallel *functional* gate. Does not download typography dependencies
  # because output bytes/stream provenance, not Figma glyph fidelity, is tested.
  blank-mkv-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm install
      - name: Pure explicit-new-target authorization and mapping tests
        run: node --test tests/v3-blank-mkv.test.mjs
      - name: Build
        run: npm run build
      - name: Chrome and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          command -v ffprobe
      - name: Preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/v3-blank-preview.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-blank-preview.log
          exit 1
      - name: Chromium default V3 and explicit rollback routing
        run: node tests/e2e/v3-default-route.e2e.mjs
      - name: Actual browser new MKV output, native ffprobe and SHA
        run: node tests/e2e/v3-blank-target.e2e.mjs
      - name: Upload real new-MKV output/evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-blank-new-segment-evidence
          path: |
            .e2e/ui-v3-blank-target/
            .e2e/ui-v3-default-route/
          retention-days: 14
          if-no-files-found: warn
