name: Browser E2E mux tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-mux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium and media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate tiny media fixtures
        run: bash tests/e2e/generate-fixtures.sh

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mkvfm-preview.log 2>&1 &
          echo $! >/tmp/mkvfm-preview.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mkvfm-preview.log
          exit 1

      - name: Browser end-to-end mux tests
        run: npm run test:e2e

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/mkvfm-preview.log || true
