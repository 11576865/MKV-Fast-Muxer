name: Browser E2E mux tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-mux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Resolve browser and required media tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled Google Chrome for real Chromium E2E."
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chrome Stable for real Chromium E2E."
          elif command -v chromium >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chromium for real Chromium E2E."
          else
            echo "No browser installed; falling back to Playwright Chromium installation."
            npx playwright install --with-deps chromium
          fi

          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          if ! dpkg -s fonts-dejavu-core >/dev/null 2>&1; then
            packages+=(fonts-dejavu-core)
          fi
          if ! command -v pyftsubset >/dev/null 2>&1; then
            packages+=(python3-fonttools)
          fi
          if (("${#packages[@]}" > 0)); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          command -v ffmpeg
          command -v ffprobe
          command -v pyftsubset

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate tiny media fixtures
        run: bash tests/e2e/generate-fixtures.sh

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mkvfm-preview.log 2>&1 &
          echo $! >/tmp/mkvfm-preview.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mkvfm-preview.log
          exit 1

      - name: Browser end-to-end mux tests
        run: npm run test:e2e

      - name: Upload MKV workbench visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkv-ui-container-tree-viewports
          path: .e2e/output/mkv-container-tree-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/mkvfm-preview.log || true
