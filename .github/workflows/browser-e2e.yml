name: Browser E2E mux tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-mux:
    runs-on: ubuntu-latest
    # Avoid terminating large-dependency cold runners before E2E starts.
    # Media/font apt downloads have shown >15m mirror latency.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve browser and required media tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled Google Chrome for real Chromium E2E."
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chrome Stable for real Chromium E2E."
          elif command -v chromium >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chromium for real Chromium E2E."
          else
            echo "No browser installed; falling back to Playwright Chromium installation."
            npx playwright install --with-deps chromium
          fi

          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          if ! command -v mkvmerge >/dev/null 2>&1 || ! command -v mkvpropedit >/dev/null 2>&1 || ! command -v mkvextract >/dev/null 2>&1; then
            packages+=(mkvtoolnix)
          fi
          if ! dpkg -s fonts-dejavu-core >/dev/null 2>&1; then
            packages+=(fonts-dejavu-core)
          fi
          if ! /usr/bin/python3 -c 'from fontTools.ttLib import TTFont, TTCollection' >/dev/null 2>&1; then
            packages+=(python3-fonttools)
          fi
          # A missing Chinese font rendered every Han character as a tofu box
          # in both desktop and phone screenshots, despite passing browser E2E.
          if ! command -v fc-list >/dev/null 2>&1; then
            packages+=(fontconfig fonts-noto-cjk)
          elif [[ -z "$(fc-list :lang=zh-cn family)" ]]; then
            packages+=(fonts-noto-cjk)
          fi
          if (("${#packages[@]}" > 0)); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          command -v ffmpeg
          command -v ffprobe
          /usr/bin/python3 -c 'from fontTools.ttLib import TTFont, TTCollection'
          echo "E2E_PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"
          # Screenshots are a visual acceptance artifact, not merely a CI file.
          # Fail explicitly when the browser host cannot render Simplified Chinese.
          fc-cache -f
          cjk_fonts="$(fc-list :lang=zh-cn family)"
          if [[ -z "$cjk_fonts" ]]; then
            echo "::error::No Chinese-capable system font. UI visual evidence is unreadable."
            exit 1
          fi
          printf '%s\n' "$cjk_fonts" | sed -n '1,3p'

      - name: Generate regular and independent Matroska fixtures
        run: |
          bash tests/e2e/generate-fixtures.sh
          bash tests/e2e/generate-independent-matroska-fixture.sh

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mkvfm-preview.log 2>&1 &
          echo $! >/tmp/mkvfm-preview.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mkvfm-preview.log
          exit 1

      # S10: actual twenty-job Chromium/FFmpeg.wasm media execution, not
      # synthetic plans or mocked outputs. Real 20 final MKV downloads,
      # source-unchanged SHA, per-item native ffprobe/FFmpeg and report audits.
      - name: S10 - twenty actual Matroska batch deliveries
        run: npm run test:e2e:batch20

      - name: Upload S10 twenty actual MKV acceptance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s10-twenty-real-matroska-batch-evidence
          path: |
            .e2e/batch20-output/softmux-s10-twenty-real-mkvs-evidence.json
            .e2e/batch20-output/Batch Stress S09E01.mkv
            .e2e/batch20-output/Batch Stress S09E10.mkv
            .e2e/batch20-output/Batch Stress S09E20.mkv
          if-no-files-found: warn
          retention-days: 14

      - name: Browser end-to-end mux tests
        run: npm run test:e2e

      # WU-03: one actual modern public-workspace task (source MKV + new ASS
      # and font + source attachment exclusion/rename). An independent native
      # oracle checks downloaded bytes, two source bitstreams, FileData hashes,
      # source immutability and honest save-state scope.
      - name: Upload WU-03 F-A single-workspace independent delivery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu03-fa-modern-workspace-actual-mkv-native-evidence
          path: |
            .e2e/output/wu03-fa-single-workspace-independent-evidence.json
            .e2e/output/selective-attachments-current-ui.mkv
            .e2e/output/selective-attachments-current-ui.mux-report.json
          if-no-files-found: warn
          retention-days: 14

      # S08: a real nested ChapterUID / targeted Tag source must be
      # rejected even via a forced runtime click. Source re-selection must
      # recover and deliver a real MKV under independent native ffprobe.
      - name: Upload S08 current workbench fail-closed and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s08-current-workbench-complex-mkv-safety
          path: |
            .e2e/output/softmux-s08-modern-source-safety-evidence.json
            .e2e/output/s08-modern-source-switch-safe.mkv
          if-no-files-found: warn
          retention-days: 14

      # S09 adversarial recovery: mismatch, conflicting old-value and
      # failed mixed undo must never partially change the current source.
      - name: Upload S09 wrong-source and mixed-inverse conflict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s09-conflict-source-attachment-atomic-undo
          path: |
            .e2e/output/s09-conflict-source-project.json
            .e2e/output/s09-conflict-reapplied.mkv
            .e2e/output/s09-conflict-atomic-undo-evidence.json
          if-no-files-found: warn
          retention-days: 14

      # S09: two independent SHA-bound draft recovery paths on one real
      # source across a full browser reload, with native finished-MKV audit.
      - name: Upload S09 cross-reload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s09-cross-reload-two-draft-real-mkv
          path: |
            .e2e/output/s09-source-project-before-reload.json
            .e2e/output/s09-external-checkpoint-before-reload.json
            .e2e/output/s09-cross-reload-recovered.mkv
            .e2e/output/s09-cross-reload-evidence.json
          if-no-files-found: warn
          retention-days: 14

      # Production-facing release gate: rendered pixels from the finished
      # browser-generated MKV, with independently extracted unique font.
      # The JSON verdict and PNG controls are uploaded even on failure.
      - name: Upload P3 final-MKV independent libass rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-final-mkv-libass-render-proof
          path: |
            .e2e/output/p3-final-ass-render-evidence.json
            .e2e/output/p3-libass-source.png
            .e2e/output/p3-libass-demuxed.png
            .e2e/output/p3-libass-final.png
            .e2e/output/p3-libass-altered.png
            .e2e/output/p3-libass-blank.png
          if-no-files-found: warn
          retention-days: 14

      # Dynamic ASS is checked on actual browser output, not only fixture
      # source files or static metadata. Upload red evidence on failures.
      - name: Upload five-step preview real-browser export and responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-step-container-recipe-workbench-evidence
          path: |
            .e2e/output/five-step-batch-recipe-v1.json
            .e2e/output/five-step-container-project-v1.json
            .e2e/output/five-step-workbench-1440.png
            .e2e/output/five-step-workbench-1024.png
            .e2e/output/five-step-workbench-390.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload P3 dynamic ASS temporal rendered frame matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-dynamic-mkv-ass-temporal-evidence
          path: |
            .e2e/output/p3-dynamic-render-evidence.json
            .e2e/output/p3-dynamic-*-source.png
            .e2e/output/p3-dynamic-*-recovered.png
            .e2e/output/p3-dynamic-*-direct.png
            .e2e/output/p3-dynamic-control-*.png
            .e2e/output/p3-dynamic-blank.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R-02 browser-created writer candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-browser-png-only-candidate-audit
          path: |
            .e2e/output/p2-r02-browser-candidate-report.json
            .e2e/output/p2-r02-real-browser-writer.mkv
            .e2e/output/p2-r02-real-browser-extracted.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload P2-M browser-created generic attachment output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-browser-multi-attachment-independent-audit
          path: |
            .e2e/output/p2-multi-browser-candidate-report.json
            .e2e/output/p2-multi-real-browser-created.mkv
            .e2e/output/p2-multi-browser-extracted-0.bin
            .e2e/output/p2-multi-browser-extracted-1.bin
          if-no-files-found: warn
          retention-days: 14

      - name: Upload P2-RG actual source read-only browser UI impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-existing-attachment-impact-browser-ui
          path: .e2e/output/p2-existing-attachment-impact-browser-report.json
          if-no-files-found: warn
          retention-days: 14

      # Research evidence must not silently become a production release gate.
      # Report itself distinguishes tool limitations from verified content.
      - name: R-02 research — PNG-only Matroska independent reader/extractor
        id: r02_attachment_only
        continue-on-error: true
        run: |
          node scripts/r02-attachment-only-experiment.mjs
          node scripts/r02-container-reader-crosscheck.mjs

      - name: Upload R-02 attachment-only reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-png-only-matroska-experiment
          path: |
            .e2e/output/r02-attachment-only-report.json
            .e2e/output/r02-container-reader-crosscheck.json
            .e2e/output/r02-attachment-only-research.mkv
            .e2e/output/r02-extracted.png
          if-no-files-found: warn
          retention-days: 14

      # R-02-W: a different candidate implementation from the R-02 fixture.
      # This remains research only; JSON verdict is required in addition to CI.
      - name: R-02-W research — JobPlan candidate writer independent audit
        id: r02_candidate_writer
        continue-on-error: true
        run: node scripts/r02-candidate-writer-independent-audit.mjs

      - name: Upload R-02-W candidate writer independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-candidate-jobplan-writer-audit
          path: |
            .e2e/output/r02-writer-candidate-report.json
            .e2e/output/r02-writer-candidate.mkv
            .e2e/output/r02-writer-candidate-extracted.png
          if-no-files-found: warn
          retention-days: 14

      # P2-M: test-only writer candidate, separate independent-tool oracle.
      # A successful workflow alone MUST NOT be called independent proof.
      - name: P2-M research — generic attachment-only writer independent audit
        id: p2_multi_attachment_writer
        continue-on-error: true
        run: node scripts/p2-multi-attachment-independent-audit.mjs

      - name: Upload P2-M candidate writer external oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-generic-multi-attachment-writer-research
          path: |
            .e2e/output/p2-multi-attachment-candidate-report.json
            .e2e/output/p2-multi-attachment-candidate.mkv
            .e2e/output/p2-multi-attachment-extracted-png.png
            .e2e/output/p2-multi-attachment-extracted-license.txt
          if-no-files-found: warn
          retention-days: 14

      # P2-existing source modification stays BLOCKED until a verified
      # relation-aware EBML writer exists. This source is authored externally.
      - name: P2 existing attachment edit intent — tagged UID fail-closed audit
        id: p2_existing_attachment_guard
        continue-on-error: true
        run: node scripts/p2-existing-attachment-edit-block-audit.mjs

      - name: Upload P2 existing attachment edit fail-closed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-existing-attachment-edit-fail-closed
          path: .e2e/output/p2-existing-attachment-edit-block-report.json
          if-no-files-found: warn
          retention-days: 14

      # P2-RG: independently authored AttachmentUID-tagged source with a
      # real decoy. Green workflow alone is not sufficient: inspect JSON.
      - name: P2-RG research — AttachmentUID target graph and impact external audit
        id: p2_attachment_relation_graph
        continue-on-error: true
        run: node scripts/p2-attachment-relation-graph-independent-audit.mjs

      - name: Upload P2-RG source relation and change-impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-existing-attachment-relation-graph-audit
          path: .e2e/output/p2-attachment-relation-graph-report.json
          if-no-files-found: warn
          retention-days: 14

      # P2-PC: necessary-only raw EBML preservation evidence on an externally
      # authored nested-Chapter/ChapterUID-targeted-Tag source.
      - name: P2-PC research — independent complex MKV raw protection contract
        id: p2_raw_preservation_contract
        continue-on-error: true
        run: node scripts/p2-raw-preservation-contract-independent-audit.mjs

      - name: Upload P2-PC protected metadata and attachment byte gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-complex-mkv-raw-protection-contract
          path: .e2e/output/p2-raw-preservation-contract-report.json
          if-no-files-found: warn
          retention-days: 14

      # P2-A research ONLY: append a fresh AttachedFile at the end of a
      # separate, independently authored MKV without original Attachments.
      # Never enable this candidate via regular mux / batch UI.
      - name: P2-A research — independent existing MKV append-only attachment audit
        id: p2_existing_append_one
        continue-on-error: true
        run: node scripts/p2-existing-mkv-append-attachment-independent-audit.mjs

      - name: Upload P2-A existing Matroska append-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-existing-mkv-append-attachment-candidate
          path: |
            .e2e/output/p2-existing-append-one-attachment-audit.json
            .e2e/output/p2-existing-append-independent-source.mkv
            .e2e/output/p2-existing-append-one-attachment-candidate.mkv
            .e2e/output/p2-existing-append-extracted-attachment.bin
          if-no-files-found: warn
          retention-days: 14

      # P2-V: independently authored MKVToolNix variant corpus. Green CI is
      # not the oracle; named JSON verdict must be inspected separately.
      - name: P2-V research — pre-Info Void layout and deny-only corpus
        id: p2_existing_void_layout_matrix
        continue-on-error: true
        run: node scripts/p2-existing-void-layout-matrix.mjs

      - name: Upload P2-V existing-MKV Void layout matrix and refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-existing-void-layout-independent-matrix
          path: |
            .e2e/output/p2-void-existing-mkv-layout-matrix-report.json
            .e2e/output/p2-layout-*-source.mkv
            .e2e/output/p2-layout-*-candidate.mkv
          if-no-files-found: warn
          retention-days: 14

      # P2-X cross-writer boundaries: valid FFmpeg-native sources can be
      # ineligible while MKVToolNix candidates retain tested decode/seek.
      # Not a product-capability gate: inspect the named JSON verdict.
      - name: P2-X research — FFmpeg writer layouts and decoder seek parity
        id: p2_cross_writer_decode_seek
        continue-on-error: true
        run: node scripts/p2-cross-writer-decode-seek-matrix.mjs

      - name: Upload P2-X independent cross-writer and seek report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-cross-writer-decode-seek-matrix
          path: |
            .e2e/output/p2-cross-writer-decode-seek-report.json
            .e2e/output/p2-cross-writer-ffmpeg-*.mkv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload P0 TrackUID relation preservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-trackuid-target-relation-audit
          path: .e2e/output/p0-tracktag-relation-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload P0 AttachmentUID relation preservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-attachmentuid-target-relation-audit
          path: .e2e/output/p0-attachmenttag-relation-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MKV workbench visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkv-ui-container-tree-viewports
          path: |
            .e2e/output/mkv-container-tree-*.png
            .e2e/output/mkv-round5-*.png
            .e2e/output/softmux-1014-*.png
            .e2e/output/softmux-figma-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/mkvfm-preview.log || true
