name: Browser E2E mux tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-mux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Resolve browser and required media tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled Google Chrome for real Chromium E2E."
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chrome Stable for real Chromium E2E."
          elif command -v chromium >/dev/null 2>&1; then
            echo "E2E_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chromium for real Chromium E2E."
          else
            echo "No browser installed; falling back to Playwright Chromium installation."
            npx playwright install --with-deps chromium
          fi

          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            packages+=(ffmpeg)
          fi
          # P0 oracle must use a reader independent of the FFmpeg mux backend.
          if ! command -v mkvmerge >/dev/null 2>&1 || ! command -v mkvextract >/dev/null 2>&1; then
            packages+=(mkvtoolnix)
          fi
          if ! dpkg -s fonts-dejavu-core >/dev/null 2>&1; then
            packages+=(fonts-dejavu-core)
          fi
          if ! /usr/bin/python3 -c 'from fontTools.ttLib import TTFont, TTCollection' >/dev/null 2>&1; then
            packages+=(python3-fonttools)
          fi
          # A missing Chinese font rendered every Han character as a tofu box
          # in both desktop and phone screenshots, despite passing browser E2E.
          if ! command -v fc-list >/dev/null 2>&1; then
            packages+=(fontconfig fonts-noto-cjk)
          elif [[ -z "$(fc-list :lang=zh-cn family)" ]]; then
            packages+=(fonts-noto-cjk)
          fi
          if (("${#packages[@]}" > 0)); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          command -v ffmpeg
          command -v ffprobe
          command -v mkvmerge
          command -v mkvextract
          /usr/bin/python3 -c 'from fontTools.ttLib import TTFont, TTCollection'
          echo "E2E_PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"
          # Screenshots are a visual acceptance artifact, not merely a CI file.
          # Fail explicitly when the browser host cannot render Simplified Chinese.
          fc-cache -f
          cjk_fonts="$(fc-list :lang=zh-cn family)"
          if [[ -z "$cjk_fonts" ]]; then
            echo "::error::No Chinese-capable system font. UI visual evidence is unreadable."
            exit 1
          fi
          printf '%s\n' "$cjk_fonts" | sed -n '1,3p'

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate regular and independently authored Matroska fixtures
        run: |
          bash tests/e2e/generate-fixtures.sh
          bash tests/e2e/generate-independent-matroska-fixture.sh

      - name: Independent MKVToolNix no-edit control
        continue-on-error: true
        run: |
          mkvmerge --quiet --output .e2e/fixtures/p0-mkvtoolnix-control.mkv .e2e/fixtures/p0-independent-mkvtoolnix.mkv
          mkdir -p .e2e/p0-control
          node scripts/p0-compare-roundtrip.mjs \
            .e2e/fixtures/p0-independent-mkvtoolnix.mkv \
            .e2e/fixtures/p0-mkvtoolnix-control.mkv \
            .e2e/p0-control/p0-mkvtoolnix-control-audit.json --deep

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mkvfm-preview.log 2>&1 &
          echo $! >/tmp/mkvfm-preview.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mkvfm-preview.log
          exit 1

      - name: Browser end-to-end mux tests
        run: npm run test:e2e

      - name: Upload MKV workbench visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkv-ui-container-tree-viewports
          path: .e2e/output/mkv-container-tree-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload P0 preservation comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkv-p0-preservation-audit
          path: |
            .e2e/output/p0-*.json
            .e2e/p0-control/p0-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/mkvfm-preview.log || true
