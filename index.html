<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>MKV Fast Muxer v3</title>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <div class="head">
          <div>
            <h1>MKV Fast Muxer v3</h1>
            <p>视频、音频直接复制；ASS 作为软字幕；TTF/OTF 作为字体附件。全程在浏览器本地处理。</p>
          </div>
          <div class="badge">Mux only · Never encode</div>
        </div>

        <div class="pickers">
          <label class="picker">
            <span class="num">1</span>
            <span class="picker-main">
              <strong>选择视频</strong>
              <small>支持 MP4 / MKV / WebM / MOV / M4V</small>
              <span id="videoName" class="filename">未选择</span>
            </span>
            <input id="videoInput" type="file" />
          </label>

          <label class="picker">
            <span class="num">2</span>
            <span class="picker-main">
              <strong>选择 ASS 字幕</strong>
              <small>支持 UTF-8、UTF-16LE、UTF-16BE；封装前会改用所上传字体的内部名称</small>
              <span id="subName" class="filename">未选择</span>
            </span>
            <input id="subInput" type="file" accept=".ass,text/plain" />
          </label>

          <label class="picker">
            <span class="num">3</span>
            <span class="picker-main">
              <strong>选择字体</strong>
              <small>TTF / OTF；强制字体模式会统一 ASS 字体名，并在封装前检查字幕字符是否缺字</small>
              <span id="fontName" class="filename">未选择</span>
            </span>
            <input id="fontInput" type="file" accept=".ttf,.otf,font/ttf,font/otf" />
          </label>
        </div>

        <div class="options">
          <label class="option-field">
            <span>新字幕语言</span>
            <select id="subtitleLanguage">
              <option value="und" selected>未指定 / 自动识别不到时使用（und）</option>
              <option value="zho">简体中文（zho）</option>
              <option value="eng">英语（eng）</option>
              <option value="jpn">日语（jpn）</option>
              <option value="kor">韩语（kor）</option>
              <option value="mul">多语言 / 双语（mul）</option>
            </select>
          </label>

          <label class="check-row">
            <input id="preserveOriginal" type="checkbox" disabled />
            <span>
              <strong>保留原 MKV 字幕与附件</strong>
              <small>仅 MKV 输入可用。未勾选时仍只保留原视频、音频、章节与全局元数据，再加入新 ASS 和字体。</small>
            </span>
          </label>
        </div>

        <div class="summary">
          <div><span>视频</span><b>Copy</b></div>
          <div><span>音频</span><b>Copy</b></div>
          <div><span>新字幕</span><b>ASS</b></div>
          <div><span>字体</span><b>Attachment</b></div>
          <div><span>输出</span><b id="outputName">—</b></div>
        </div>

        <div class="actions">
          <button id="muxBtn" class="primary" type="button">开始封装</button>
          <button id="cancelBtn" class="secondary" type="button" disabled>取消任务</button>
        </div>

        <div class="notice">
          当前默认行为不会保留输入 MKV 已有的字幕轨和附件；需要保留时请显式勾选上方选项。
        </div>

        <div id="status" class="status" aria-live="polite">选择三个文件后即可开始。</div>
        <div class="progress" aria-hidden="true"><div id="bar"></div></div>

        <a id="downloadLink" class="download hidden" href="#" download>保存 MKV</a>

        <details>
          <summary>日志</summary>
          <pre id="log"></pre>
        </details>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
